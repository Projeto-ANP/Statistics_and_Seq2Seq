# Ambiente para combinations/ade.py (ADE via metaforecast).
#
#     conda env create -f ade_environment.yml
#     conda activate ade-combinations
#     python -m combinations.ade --dataset ANP_MONTHLY
#
# Env separado do `agno` de propósito: metaforecast puxa neuralforecast +
# pytorch-lightning + torch, e as versões de numpy/sklearn que ele exige
# rebaixariam as que o resto do projeto usa.
name: ade-combinations
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.13.1
  - scikit-learn=1.2.2
  - lightgbm=4.5.0
  - pip:
      # setuptools 81+ removeu `pkg_resources`, que o lightning_fabric ainda
      # chama no import (`pkg_resources.declare_namespace`). Sem este pin, o
      # `from metaforecast.ensembles import ADE` falha com
      # ModuleNotFoundError: No module named 'pkg_resources'.
      - setuptools<81
      - metaforecast==0.2.2
