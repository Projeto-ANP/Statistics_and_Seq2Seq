name: metrics
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - multi_comp_matrix==0.0.4
      # multi_comp_matrix pins these exactly (==, not >=), which is why it needs
      # its own env: installing it inside `agno` would downgrade pandas/scipy
      # there and risk changing byte-identical metric comparisons.
      - numpy==1.26.4
      - pandas==2.2.3
      - matplotlib==3.7.4
      - scipy==1.11.4
      - baycomp==1.0
      - tqdm==4.66.1
