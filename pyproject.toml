[project]
name = "statistics-and-seq2seq"
version = "0.1.0"
description = "Time series forecast combination with a ReAct combiner agent over deterministic tools"
requires-python = ">=3.11,<3.12"

dependencies = [
    # numeric / data core
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",

    # statistical diagnostics: STL, ADF/KPSS, Ljung-Box
    "statsmodels>=0.14",

    # DBA (dtw_barycenter_averaging) — combine_dba()
    "tslearn>=0.6",

    # LLM layer (local Ollama)
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",

    # plots used by combinations/plots.py and the notebooks
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# catch22 features for series_profile() — needs a C compiler.
# Fallback: the fast statistical subset in orchestrator_react/features.py
catch22 = ["pycatch22>=0.4"]

# only if the Phase 3 ReAct loop becomes a state graph
graph = ["langgraph>=0.2"]

# test suite
dev = ["pytest>=8.0"]

# weight meta-model (FFORMA/ADE). See divergence D7 in EXPLORACAO.md
fforma = [
    "xgboost>=2.0",
    "lightgbm>=4.5",
    "metaforecast==0.2.2",
]

[tool.uv]
package = false
