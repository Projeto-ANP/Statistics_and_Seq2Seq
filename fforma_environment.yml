# Ambiente para combinations/fforma.py (FFORMA: tsfeatures + XGBoost).
#
#     conda env create -f fforma_environment.yml
#     conda activate fforma-combinations
#     python -m combinations.fforma --dataset ANP_MONTHLY
#
# Env separado do `ade-combinations`: o FFORMA não precisa de torch/lightning,
# e o `tsfeatures` exige statsmodels/numba, que não são necessários no ADE.
name: fforma-combinations
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.13.1
  - scikit-learn=1.2.2
  - statsmodels=0.14.2
  - pip:
      # XGBoost >= 2.1 entrega `predt` com shape (n_amostras, n_classes) para
      # objetivos customizados — é o formato que `_fforma_objective` espera.
      - xgboost==2.1.4
      - tsfeatures==0.4.5
      - antropy
      - supersmoother
